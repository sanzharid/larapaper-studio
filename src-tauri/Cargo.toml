[package]
name = "larapaper-studio"
version = "0.1.0"
description = "Larapaper Studio — TRMNL recipe builder"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[features]
# This feature is used for production builds where `devUrl` points to the dev server.
custom-protocol = ["tauri/custom-protocol"]
